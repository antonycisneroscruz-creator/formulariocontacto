<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            padding: 35px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 26px;
            border-bottom: 3px solid #667eea;
            display: inline-block;
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #667eea;
        }

        .captcha-box {
            background: #f0f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #667eea;
            font-size: 14px;
        }

        .captcha-box label {
            color: #4f46e5;
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #1ebe5d;
            transform: translateY(-1px);
        }

        .btn-whatsapp:active {
            transform: translateY(1px);
        }

        .map-section {
            background: #e5e7eb;
            position: relative;
            min-height: 350px;
        }

        .map-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sección del Formulario -->
        <div class="form-section">
            <h2>Contáctanos</h2>
            <form id="contactForm" onsubmit="enviarWhatsApp(event)">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required placeholder="Tu nombre completo">
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" required placeholder="Tu número de teléfono">
                </div>

                <div class="input-group">
                    <label for="comentario">Comentario:</label>
                    <textarea id="comentario" rows="3" required placeholder="Escribe tu mensaje..."></textarea>
                </div>

                <!-- CAPTCHA Matemático Dinámico -->
                <div class="captcha-box">
                    <label for="captchaInput" id="captchaQuestion">¿Cuánto es ? + ?</label>
                    <input type="number" id="captchaInput" required placeholder="Escribe el resultado">
                </div>

                <button type="submit" class="btn-whatsapp">
                    🚀 Enviar por WhatsApp
                </button>
            </form>
        </div>

        <!-- Sección del Mapa -->
        <div class="map-section">
            <!-- Mapa interactivo de Google Maps (Ejemplo: Zócalo de la CDMX, cámbialo por tu ubicación real) -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.8340989060594!2d-99.13538152479261!3d19.432607640994966!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1fed2eedd301f%3A0x464529bc0da5d16d!2sZ%C3%B3calo%2C%20Centro%20Hist%C3%B3rico%20de%20la%20Ciudad%20de%20M%C3%A9xico%2C%20Cd.%20M%C3%A9xico!5e0!3m2!1ses!2smx!4v1700000000000!5m2!1ses!2smx" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script>
        // Generar números aleatorios para el CAPTCHA matemático al cargar la página
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const respuestaCorrecta = num1 + num2;
        
        // Mostrar la pregunta en pantalla
        document.getElementById('captchaQuestion').innerText = `Verificación de seguridad: ¿Cuánto es ${num1} + ${num2}?`;

        function enviarWhatsApp(event) {
            event.preventDefault();

            // Validar el resultado del CAPTCHA
            const respuestaUsuario = parseInt(document.getElementById('captchaInput').value);
            if (respuestaUsuario !== respuestaCorrecta) {
                alert("❌ El resultado del CAPTCHA es incorrecto. Por favor, inténtalo de nuevo.");
                return;
            }

            // Recoger los datos del formulario
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const comentario = document.getElementById('comentario').value.trim();

            // REEMPLAZA ESTE NÚMERO con tu número de WhatsApp real (Código de país + Lada + Número, ej: 5215512345678)
            const tuNumeroWhatsApp = "5215500000000"; 

            // Estructurar el mensaje para WhatsApp
            const mensaje = `Hola, me contacto desde la web:\n\n*Nombre:* ${nombre}\n*Teléfono:* ${telefono}\n*Comentario:* ${comentario}`;

            // Codificar el mensaje para que funcione correctamente en la URL
            const urlWhatsApp = `https://wa.me/${tuNumeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;

            // Abrir WhatsApp en una pestaña nueva
            window.open(urlWhatsApp, '_blank');
        }
    </script>

</body>
</html>
