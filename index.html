<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 850px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            padding: 30px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            display: inline-block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        .captcha-box {
            background: #f0f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .map-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-section">
        <h2>Contáctanos</h2>

        <form onsubmit="enviarWhatsApp(event)">

            <div class="input-group">
                <label>Nombre:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="input-group">
                <label>Teléfono:</label>
                <input type="tel" id="telefono" maxlength="10" required>
            </div>

            <div class="input-group">
                <label>Comentario:</label>
                <textarea id="comentario" required></textarea>
            </div>

            <div class="captcha-box">
                <label id="captchaQuestion"></label>
                <input type="number" id="captchaInput" required>
            </div>

            <button type="submit" class="btn-whatsapp">
                Enviar por WhatsApp
            </button>

        </form>
    </div>

    <div class="map-section">
        <iframe src="https://www.google.com/maps/embed?..."></iframe>
    </div>

</div>

<script>
let num1 = Math.floor(Math.random() * 10) + 1;
let num2 = Math.floor(Math.random() * 10) + 1;
let respuestaCorrecta = num1 + num2;

document.getElementById('captchaQuestion').innerText =
    "¿Cuánto es " + num1 + " + " + num2 + "?";

const inputTelefono = document.getElementById('telefono');

inputTelefono.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
});

function enviarWhatsApp(e) {
    e.preventDefault();

    const respuesta = parseInt(document.getElementById('captchaInput').value);
    if (respuesta !== respuestaCorrecta) {
        alert("CAPTCHA incorrecto");
        return;
    }

    const nombre = document.getElementById('nombre').value;
    const telefono = inputTelefono.value;
    const comentario = document.getElementById('comentario').value;

    if (telefono.length < 10) {
        alert("Número inválido");
        return;
    }

    const numero = "522204701761";

    const mensaje = "Hola, soy " + nombre +
        ". Tel: " + telefono +
        ". Comentario: " + comentario;

    const url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

    window.open(url, "_blank");
}
</script>

</body>
</html>
